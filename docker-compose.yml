services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studytrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-studytrace}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"] # loopback only
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  memory_service:
    build: { context: ., dockerfile: docker/memory_service.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studytrace}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-studytrace}
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]
    command: >
      sh -c "alembic upgrade head &&
             uvicorn memory_service.api:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
